# Serves the built SPA (web/dist, mounted at /usr/share/nginx/html) and reverse
# proxies /api (REST + the /api/jobs/{id}/stream WebSocket) to the `api` service.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST endpoints and the WebSocket job stream, proxied to the API container.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers — required for GET /api/jobs/{id}/stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Client-side routing (SPA): fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
